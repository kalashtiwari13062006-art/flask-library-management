{% extends "base.html" %}

{% block title %}Signup{% endblock %}

{% block content %}

<div class="form-box">

    <h2>📝 Create Account</h2>

    <p>Create your library account</p>


    <form method="POST">

        <label>Name</label>

        <input
            type="text"
            name="name"
            placeholder="Enter your name"
            required
        >


        <label>Username</label>

        <input
            type="text"
            name="username"
            placeholder="Enter username"
            required
        >


        <label>Password</label>

        <input
            type="password"
            name="password"
            placeholder="Enter password"
            required
        >


        <button class="btn blue full">
            Create Account
        </button>

    </form>


    <p class="bottom-text">

        Already have an account?

        <a href="{{ url_for('login') }}">
            Login
        </a>

    </p>

</div>

{% endblock %}
